<!-- ============================================================
     提交留言页面（submit.html）
     作用：用户填写留言信息并提交的表单页面
     关系：从 index.html 点击"发表留言"跳转过来
           提交成功后可以点击"返回留言板"回去查看
     ============================================================ -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发表留言</title>
    <!-- 和 index.html 共用同一个 style.css，保持风格统一 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- header：页面顶部标题 -->
        <header>
            <h1>发表留言</h1>
            <p>请填写以下信息提交您的留言</p>
        </header>

        <!-- form-section：表单区域 -->
        <section class="form-section">
            <!-- section-header：放了一个"返回留言板"的链接按钮 -->
            <div class="section-header">
                <!-- nav-back 是返回按钮的样式，比普通导航按钮更小巧 -->
                <a href="index.html" class="nav-btn nav-back">← 返回留言板</a>
            </div>

            <!-- form 是 HTML 表单标签，id="messageForm" 供 JS 获取和绑定事件 -->
            <!-- 注意：我们没有设置 form 的 action 属性，因为用 JS 的 fetch 来提交 -->
            <form id="messageForm">
                <!-- form-group：每个表单项的容器 -->
                <div class="form-group">
                    <!-- label 的 for 属性关联到 input 的 id，点击 label 会自动聚焦到输入框 -->
                    <label for="name">姓名</label>
                    <!-- required 表示这个字段必填，浏览器会阻止提交空内容 -->
                    <!-- placeholder 是输入框内的灰色提示文字 -->
                    <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
                </div>

                <div class="form-group">
                    <label for="contact">联系方式</label>
                    <input type="text" id="contact" name="contact" required placeholder="请输入您的联系方式（电话/邮箱）">
                </div>

                <div class="form-group">
                    <label for="content">留言内容</label>
                    <!-- textarea 是多行文本输入框，rows="4" 表示显示 4 行高度 -->
                    <textarea id="content" name="content" required placeholder="请输入留言内容" rows="4"></textarea>
                </div>

                <!-- captcha-group：验证码区域，单独一个样式类 -->
                <div class="form-group captcha-group">
                    <label for="captcha">验证码</label>
                    <!-- captcha-row：把输入框和验证码图片放在同一行 -->
                    <div class="captcha-row">
                        <input type="text" id="captcha" name="captcha" required placeholder="请输入验证码">
                        <!-- canvas 是 HTML5 的画布元素，JS 会在上面绘制验证码图片 -->
                        <!-- onclick="refreshCaptcha()" 点击图片时刷新验证码 -->
                        <canvas id="captchaCanvas" onclick="refreshCaptcha()"></canvas>
                    </div>
                    <span class="captcha-hint">点击图片刷新验证码</span>
                </div>

                <!-- submit-btn：提交按钮 -->
                <!-- id="submitBtn" 供 JS 控制禁用/启用状态 -->
                <!-- button 的 type="submit" 点击时会触发表单的 submit 事件 -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <!-- btn-text：按钮上显示的文字 -->
                    <span class="btn-text">提交留言</span>
                    <!-- spinner：转圈动画元素，默认隐藏（display: none） -->
                    <!-- 提交时 JS 会给按钮添加 .loading 类，spinner 就会显示出来 -->
                    <span class="spinner"></span>
                </button>
            </form>
        </section>
    </div>

    <!-- 和 index.html 共用同一个 script.js -->
    <!-- script.js 会自动检测当前页面是哪个，执行对应的功能 -->
    <script src="script.js"></script>
</body>
</html>
