<!-- ============================================================
     留言板主页（index.html）
     作用：展示所有留言的列表页面
     关系：这是网站的首页，用户在这里查看留言
           点击"发表留言"按钮会跳转到 submit.html 去提交新留言
     ============================================================ -->

<!-- DOCTYPE 声明：告诉浏览器这是一个 HTML5 文档 -->
<!DOCTYPE html>
<!-- lang="zh-CN" 声明页面语言为简体中文 -->
<html lang="zh-CN">
<head>
    <!-- meta charset="UTF-8"：指定字符编码为 UTF-8，支持中文、日文等所有文字 -->
    <meta charset="UTF-8">
    <!-- viewport：让页面在移动设备上正常显示，1:1 比例，不缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签栏上显示的标题 -->
    <title>留言板</title>
    <!-- 引入外部 CSS 样式文件，href 指定文件路径 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- container：整个页面的内容容器，控制最大宽度和居中 -->
    <div class="container">
        <!-- header：页面顶部的标题区域 -->
        <header>
            <h1>留言板</h1>  <!-- h1 是页面主标题 -->
            <p>欢迎留下您的宝贵意见</p>  <!-- p 是段落文字 -->
        </header>

        <!-- messages-section：留言列表区域 -->
        <section class="messages-section">
            <!-- section-header：标题栏，用 flex 布局把标题和按钮放在一行 -->
            <div class="section-header">
                <h2>留言列表</h2>
                <!-- a 是链接标签，href="submit.html" 点击后跳转到提交页面 -->
                <!-- class="nav-btn" 让这个链接看起来像一个按钮 -->
                <a href="submit.html" class="nav-btn">发表留言</a>
            </div>
            <!-- messagesContainer：这是 JS 动态填充留言内容的地方 -->
            <!-- 初始显示 "加载中..."，JS 加载完成后会替换里面的内容 -->
            <div id="messagesContainer">
                <div class="loading">加载中...</div>
            </div>
        </section>
    </div>

    <!-- 引入外部 JavaScript 文件 -->
    <!-- script 标签放在 body 底部：确保 HTML 元素先加载完毕，JS 再执行 -->
    <script src="script.js"></script>
</body>
</html>
